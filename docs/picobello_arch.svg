  <text x="460" y="41" font-size="9.5" text-anchor="middle" fill="#94A3B8">Narrow 64-bit + Wide 512-bit AXI4  ·  XY Routing  ·  Collective Ops: Multicast / Barrier / Reduction</text>

  <!-- ── Column group labels ── -->
