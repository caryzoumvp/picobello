  <line x1="582" y1="57" x2="582" y2="63" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="366" y="56" font-size="9" font-weight="bold" text-anchor="middle" fill="#60A5FA">4 × 4 Snitch Cluster Array  (16 tiles · 9 cores each · 144 RV32 cores total)</text>
