  <text x="392" y="429" font-size="9" fill="#CBD5E1">FhG SPU Tile  (accelerator, 256 KB)</text>
  <!-- NoC link -->
  <line x1="370" y1="447" x2="388" y2="447" stroke="#64748B" stroke-width="3"/>
  <text x="392" y="451" font-size="9" fill="#CBD5E1">FlooNoC Link  (bidirectional: Narrow 64-bit AXI4 + Wide 512-bit AXI4)</text>

  <!-- Logical-to-physical X note -->
  <text x="30" y="488" font-size="8.5" fill="#64748B">Logical X offset: clusters start at logical x=4 (power-of-two multicast alignment); picobello_pkg.sv::SamPhysical collapses empty cols 1–3 → 7×4 physical mesh.</text>
  <text x="30" y="503" font-size="8.5" fill="#64748B">Software: Cheshire (CVA6) boots via JTAG, loads binaries, offloads kernels to Snitch clusters over the NoC; results land in L2 SPM tiles.</text>
  <text x="30" y="518" font-size="8.5" fill="#64748B">Collective ops use AXI4 USER field bits for multicast mask (48-bit) + collective opcode (4-bit); FlooNoC handles in-network reduction/barrier/multicast without CPU involvement.</text>
  <text x="30" y="533" font-size="8.5" fill="#64748B">Generated files: .generated/floo_picobello_noc_pkg.sv (from cfg/picobello_noc.yml), snitch_cluster_wrapper.sv, pb_soc_regs.sv.  Regenerate with: make floo-clean floo-hw-all  or  make all</text>
</svg>
